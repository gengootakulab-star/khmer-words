name: 間違いの報告
description: 読み・文字の分解・説明などの間違いを教えてください
title: "[間違い] "
body:
  - type: markdown
    attributes:
      value: |
        ご協力ありがとうございます。分かる範囲で書いてください。
  - type: input
    id: word
    attributes:
      label: 単語
      description: 間違いがあった単語(クメール文字)
      placeholder: ខ្មែរ
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: どの部分が違いますか
      options:
        - 読みの目安(IPA)
        - a系列・o系列の判定
        - 文字・記号の説明
        - 文字のまとまりの分け方
        - 表示・動作の不具合
        - その他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 内容
      description: どこが違うか、正しいと思う内容(出典があれば)を教えてください
    validations:
      required: true
